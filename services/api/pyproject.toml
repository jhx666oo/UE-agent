[project]
name = "ue-agent-api"
version = "0.1.0"
description = "UE Agent deterministic U1 calculation domain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[tool.ue-agent]
model-version = "u1-excel-v2.1-parity"
